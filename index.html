<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WISP Support Admin</title>
    <!-- Подключаем официальный SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        h2 { text-align: center; font-size: 20px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button {
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        .danger { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <h2> Панель Модератора</h2>
    <p style="text-align: center; opacity: 0.7; font-size: 14px;">Выберите действие для пользователя</p>
    
    <div class="btn-group">
        <button onclick="sendAction('ban')"> Забанить (навсегда)</button>
        <button onclick="sendAction('kick')"> Кикнуть (может вернуться)</button>
        <button onclick="sendAction('mute')"> Замутить</button>
        <button onclick="sendAction('unmute')"> Размутить</button>
        <button class="danger" onclick="sendAction('unban')"> Разбанить</button>
    </div>

    <script>
        // Инициализация Web App
        const tg = window.Telegram.WebApp;
        tg.ready(); // Говорим Telegram, что приложение готово
        tg.expand(); // Разворачиваем на весь экран

        // Функция отправки действия в бота
        function sendAction(action) {
            const data = {
                action: action,
                // В реальном проекте здесь передается ID пользователя из контекста
                target_user_id: 123456789 // Замени на логику получения ID
            };
            
            tg.sendData(JSON.stringify(data)); // Отправляем данные боту
            tg.close(); // Закрываем Web App после действия
        }
    </script>
</body>
</html>
